name: Stage npm release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @privacyspec/playwright exec playwright install chromium

      - name: Validate release candidate
        run: pnpm check && pnpm format:check && pnpm build && pnpm test

      - name: Verify npm package contents
        run: npm pack --dry-run --json
        working-directory: packages/privacyspec

      - name: Stage package for maintainer approval
        run: npm stage publish --access public --tag beta
        working-directory: packages/privacyspec

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease --title "$GITHUB_REF_NAME" --verify-tag
